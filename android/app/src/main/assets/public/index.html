<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Photo Report</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1a1d21;--mu:#6b7480;--ac:#1565c0;--ok:#2e7d32;--bd:#dde1e6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171a;--card:#1f2428;--tx:#e8eaed;--mu:#99a3ad;--ac:#64a8ff;--ok:#66bb6a;--bd:#333a41}}
:root[data-theme="dark"]{--bg:#14171a;--card:#1f2428;--tx:#e8eaed;--mu:#99a3ad;--ac:#64a8ff;--ok:#66bb6a;--bd:#333a41}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px system-ui,Arial,sans-serif;padding:12px;max-width:560px;margin:auto}
h1{font-size:20px;margin:4px 0 12px}.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
input[type=text]{width:100%;padding:12px;font-size:16px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)}
button,.btn{display:block;width:100%;padding:13px;font-size:16px;border:0;border-radius:8px;background:var(--ac);color:#fff;text-align:center;margin-top:8px;font-weight:600}
button.sec{background:transparent;color:var(--ac);border:1px solid var(--ac)}button:disabled{opacity:.4}
#prev{width:100%;border-radius:8px;margin-top:8px;display:none}.match{margin-top:8px;color:var(--mu);font-size:14px}.match b{color:var(--tx)}
.sug{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.sug span{padding:6px 10px;border:1px solid var(--bd);border-radius:16px;font-size:13px}
.slot{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--bd);font-size:14px}.slot:last-child{border:0}
.slot img{width:44px;height:33px;object-fit:cover;border-radius:4px}.slot .n{flex:1}.slot .e{width:44px;height:33px;border:1px dashed var(--bd);border-radius:4px}
.slot{padding:10px 0}.slot button{width:auto;margin:0;padding:8px 12px;font-size:14px}.ok{color:var(--ok)}
</style></head><body>
<h1>📷 Photo Report → Excel</h1>
<div class="card" style="color:var(--mu);font-size:14px">Tap 📷 Photo next to a description → camera opens → photo is inserted into that Excel slot.</div>
<div class="card"><b id="cnt"></b>
 <button id="exp">Download Excel (.xlsx)</button>
 <button class="sec" id="clr">Clear all photos</button></div>
<div class="card" id="list"></div>
<script src="exceljs.min.js"></script>
<script>
// ---- slots (same layout as 2_Weeks_Report.xlsx) ----
const P=[["FUNNEL","FUNNEL FROM AFT"],["MONKEY ISLAND","MAIN MAST"],["AFT STATION FROM STBD WING","AFT STATION FROM PS WING"],["AFT MOORING STATION","SUPERSTRUCTURE FROM FORWARD"],["SUPERSTRUCTURE FROM PS AFT","SUPERSTRUCTURE FROM STB AFT"],["MAIN DECK PS AFT TOWARDS FORWARD","MAIN DECK STB AFT TOWARDS FORWARD"],["MAIN DECK PS MID TOWARDS FORWARD","MAIN DECK STB MID TOWARDS FWD"],["MAIN DECK PS FORWARD","MAIN DECK STB FORWARD"],["FOREMAST","FORWARD MOORING STATION"],["CRANE #1","CRANE #2"],["CRANE #3","CRANE #4"]];
const S=[];let r=1;
P.forEach(p=>{p.forEach((n,i)=>S.push({name:n,col:i?5:0,row:r}));r+=13});
for(let i=1;i<=5;i++){S.push({name:`COAMING #${i} PS`,col:0,row:r,lab:`COAMING #${i} PS / STBD`,head:1});S.push({name:`COAMING #${i} STBD`,col:5,row:r});r+=13}
[[1,2],[3,4],[5]].forEach(p=>{p.forEach((n,i)=>S.push({name:`HATCH COVER #${n}`,col:i?5:0,row:r}));r+=13});
S.forEach((s,i)=>s.id=i);
// ---- state ----
let photos={},cur=null,curSlot=null;const $=id=>document.getElementById(id);
function db(){return new Promise((ok,no)=>{try{const q=indexedDB.open("photoreport",1);q.onupgradeneeded=()=>q.result.createObjectStore("k");q.onsuccess=()=>ok(q.result);q.onerror=()=>no()}catch(e){no()}})}
async function save(){try{const d=await db();d.transaction("k","readwrite").objectStore("k").put(photos,"p")}catch(e){}}
async function load(){try{const d=await db();const q=d.transaction("k").objectStore("k").get("p");q.onsuccess=()=>{photos=q.result||{};render()}}catch(e){}}
let target=null;
const FW=272,FH=238,CW=1000,CH=Math.round(1000*FH/FW);
function cropTo(im,d){const c=document.createElement("canvas");c.width=CW;c.height=CH;const k=Math.max(CW/im.width,CH/im.height),w=im.width*k,h=im.height*k;c.getContext("2d").drawImage(im,(CW-w)/2,(CH-h)/2,w,h);if(d)stamp(c,d);return c.toDataURL("image/jpeg",.8)}
function stamp(c,d){const x=c.getContext("2d"),z=v=>String(v).padStart(2,"0"),t=`${z(d.getDate())}.${z(d.getMonth()+1)}.${d.getFullYear()}`,f=Math.round(c.height*.055);
 x.font=`${f}px Arial,sans-serif`;x.textBaseline="bottom";x.textAlign="left";x.fillStyle="#fff";
 const px=Math.round(f*.6),py=c.height-Math.round(f*.5);x.fillText(t,px,py)}
const loadImg=u=>new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=u});
function pick(e,t){const f=e.target.files[0];e.target.value="";if(!f)return;const im=new Image();im.onload=()=>{let d=new Date(f.lastModified);if(!(d.getFullYear()>=2000))d=new Date();photos[t]=cropTo(im,d);save();render();const nx=S.find(s=>!photos[s.id]&&s.id>t);if(nx){const el=document.getElementById("s"+nx.id);el&&el.scrollIntoView({block:"center"})}};im.src=URL.createObjectURL(f)}
function render(){const n=Object.keys(photos).length;$("cnt").textContent=`${n} of ${S.length} photos inserted`;
 $("list").innerHTML="";S.forEach(s=>{const d=document.createElement("div");d.className="slot";d.id="s"+s.id;const p=photos[s.id];
 d.innerHTML=(p?`<img src="${p}">`:'<div class="e"></div>')+`<span class="n ${p?"ok":""}">${s.name}</span>`;
 const b=document.createElement("label");b.className="btn"+(p?" sec":"");b.style.cssText="position:relative;overflow:hidden;width:auto;margin:0;padding:8px 12px;font-size:14px;"+(p?"background:transparent;color:var(--ac);border:1px solid var(--ac)":"");b.textContent=p?"Retake":"📷 Photo";
 const i=document.createElement("input");i.type="file";i.accept="image/*";i.setAttribute("capture","environment");i.style.cssText="position:absolute;inset:0;opacity:0;width:100%;height:100%;font-size:100px";i.onchange=e=>pick(e,s.id);b.append(i);d.append(b);
 if(p){const x=document.createElement("button");x.className="sec rm";x.textContent="✕";x.onclick=ev=>{ev.stopPropagation();delete photos[s.id];save();render()};d.append(x)}
 $("list").append(d)})}
$("clr").onclick=()=>{if(confirm("Remove all photos?")){photos={};save();render()}};
// ---- Excel export ----
$("exp").onclick=async()=>{if(!window.ExcelJS)return alert("Excel library not loaded (check internet).");
 const wb=new ExcelJS.Workbook();
 const ws=wb.addWorksheet("2 Weekly Overview Photo");ws.getColumn(5).width=2.86;[1,6].forEach(c=>ws.getColumn(c).width=11.43);[2,3,4,7,8,9].forEach(c=>ws.getColumn(c).width=8.43);for(let i=1;i<=S[S.length-1].row+14;i++)ws.getRow(i).height=15;
 const font={name:"Arial",size:10};
 for(const s of S){const c=ws.getCell(s.row,s.col+1);c.value=s.lab||s.name;c.font=font;if(s.head)ws.mergeCells(s.row,1,s.row,8);
  let p=photos[s.id];if(!p)continue;p=cropTo(await loadImg(p));const id=wb.addImage({base64:p,extension:"jpeg"});
  ws.addImage(id,{tl:{col:s.col,row:s.row},ext:{width:FW,height:FH},editAs:"oneCell"})}
 const buf=await wb.xlsx.writeBuffer();const n=new Date(),z=v=>String(v).padStart(2,"0"),stamp=`${n.getFullYear()}-${z(n.getMonth()+1)}-${z(n.getDate())}`;
 const fn=`${stamp}.xlsx`;
 try{
  const cap=window.Capacitor,nat=cap&&cap.isNativePlatform&&cap.isNativePlatform();
  if(nat){
   const u8=new Uint8Array(buf);let bin="";for(let i=0;i<u8.length;i+=32768)bin+=String.fromCharCode.apply(null,u8.subarray(i,i+32768));
   const FS=cap.Plugins.Filesystem,SH=cap.Plugins.Share;
   const w=await FS.writeFile({path:fn,data:btoa(bin),directory:"CACHE"});
   await SH.share({title:fn,dialogTitle:"Save / send Excel",url:w.uri});
  }else{
   const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}));a.download=fn;document.body.append(a);a.click();a.remove()}
 }catch(e){if(!(e&&/cancel/i.test(e.message||"")))alert("Export failed: "+((e&&e.message)||e))}};
render();load();
</script></body></html>
